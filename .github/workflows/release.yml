name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read version and verify tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version v${VERSION}" >&2
              exit 1
            fi
          fi
          echo "Releasing ${VERSION} from ${GITHUB_REF}"

      - name: Test
        run: npm test

      - name: Pack
        id: pack
        shell: bash
        run: |
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ steps.version.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Publish to npm (optional)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@lobo777/bilibili-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} is already published; skipping."
            exit 0
          fi
          npm publish --access public --tag beta --provenance

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
